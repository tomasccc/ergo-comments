<div id="giscus-container">
  {% if config.extra.giscus %}
  <script src="https://giscus.app/client.js"
        data-repo="{{ config.extra.giscus.repo }}"
        data-repo-id="{{ config.extra.giscus.repo_id }}"
        data-category="{{ config.extra.giscus.category }}"
        data-category-id="{{ config.extra.giscus.category_id }}"
        data-mapping="title"
        data-strict="0"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="top"
        data-theme="preferred_color_scheme"
        data-lang="es"
        data-loading="lazy"
        crossorigin="anonymous"
        async>
  </script>
  {% else %}
    <p><em>Los comentarios no están configurados para esta wiki :( .</em></p>
  {% endif %}
</div>

<script>
  function updateGiscusTheme() {
    const theme = document.body.getAttribute('data-md-color-scheme') === 'slate' ? 'dark' : 'light';
    const iframe = document.querySelector('iframe.giscus-frame');
    if (iframe) {
      iframe.contentWindow.postMessage(
        { giscus: { setConfig: { theme: theme } } },
        'https://giscus.app'
      );
    }
  }

  const observer = new MutationObserver((mutations) => {
    mutations.forEach((mutation) => {
      if (mutation.attributeName === 'data-md-color-scheme') {
        updateGiscusTheme();
      }
    });
  });

  observer.observe(document.body, { attributes: true });
</script>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    const modal = document.getElementById("modal-compartir");
    const btnCerrar = document.getElementById("btn-cerrar-modal");
    const btnCopiar = document.getElementById("btn-copiar-link");
    const btnWsp = document.getElementById("btn-wsp");
    const btnTg = document.getElementById("btn-tg");
    const btnTw = document.getElementById("btn-tw");
    
    let urlACompartir = "";

    const permalinks = document.querySelectorAll(".headerlink");
    
    permalinks.forEach(link => {
      link.addEventListener("click", function(e) {
        e.preventDefault();
        
        const href = this.getAttribute("href");
        history.pushState(null, null, href);
        document.querySelector(href).scrollIntoView({ behavior: 'smooth' });

        urlACompartir = window.location.origin + window.location.pathname + window.location.search + href;
        
        const textoTitulo = this.parentElement.textContent.replace(/[¶#∞]/g, "").trim();
        document.getElementById("titulo-compartir").innerText = textoTitulo;

        const mensaje = encodeURIComponent("¡Mirá este apunte de FAMAF! " + textoTitulo);
        const urlEncodeada = encodeURIComponent(urlACompartir);

        btnWsp.href = "https://api.whatsapp.com/send?text=" + mensaje + "%20" + urlEncodeada;
        btnTg.href = "https://t.me/share/url?url=" + urlEncodeada + "&text=" + mensaje;
        btnTw.href = "https://twitter.com/intent/tweet?text=" + mensaje + "&url=" + urlEncodeada;

        btnCopiar.classList.remove("copiado");
        btnCopiar.querySelector("svg").innerHTML = '<path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>';
        btnCopiar.lastChild.textContent = " Copiar enlace";

        modal.style.display = "flex";
      });
    });

    function cerrarModal() {
      modal.style.display = "none";
    }

    btnCerrar.addEventListener("click", cerrarModal);
    
    modal.addEventListener("click", (e) => {
      if (e.target === modal) cerrarModal();
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && modal.style.display === "flex") cerrarModal();
    });

    btnCopiar.addEventListener("click", () => {
      navigator.clipboard.writeText(urlACompartir).then(() => {
        btnCopiar.classList.add("copiado");
        btnCopiar.querySelector("svg").innerHTML = '<path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>';
        btnCopiar.lastChild.textContent = " ¡Copiado!";
        setTimeout(cerrarModal, 1200);
      });
    });
  });
</script>
